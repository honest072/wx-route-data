name: adsb-weekly
# 공개 ADS-B 항적(adsb.lol, ODbL) 최근 14일 → 비행 단계 시각·편명-노선·실제 사용 활주로·실측 바람(얇은 층 급변·검증 표본) → adsb 브랜치
on:
  schedule:
    - cron: '7 18 * * 2'          # 매주 수요일 03:07(한국)
  workflow_dispatch:
    inputs:
      days:
        description: '기간(일) — 대표 경로는 이전 주 누적분과 합쳐 같은 시즌 안에서 자동으로 기간을 넓힘'
        default: '14'

permissions:
  contents: write

concurrency:
  group: adsb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 이전 누적 자료(대표 경로용 편별 값)
        run: git clone --depth 1 -b adsb https://github.com/${GITHUB_REPOSITORY}.git adsb/prev || true
      - name: 공항 기상 보관분(복행·홀딩·회항과 짝지을 METAR)
        run: git clone --depth 1 -b wxlog https://github.com/${GITHUB_REPOSITORY}.git adsb/wx || true
      - name: 항적 받기·계산
        run: bash adsb/run.sh ${{ inputs.days || '14' }}
      - name: 올리기(adsb 브랜치)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub && cp adsb/app.json adsb/rwy.json adsb/shear.json adsb/obs.json adsb/pfx_app.json adsb/pfa_app.json adsb/route.json adsb/rprof.json adsb/apops.json adsb/apev.json adsb/tod2.log pub/ 2>/dev/null || true
          cd pub
          git init -b adsb
          git config user.name "wx-bot"; git config user.email "wx-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "adsb $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git adsb
