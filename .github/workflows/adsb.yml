name: adsb-weekly
# 공개 ADS-B 항적(adsb.lol, ODbL) 최근 14일 → 비행 단계 시각·편명-노선·실제 사용 활주로 → adsb 브랜치(app.json)
on:
  schedule:
    - cron: '7 18 * * 2'          # 매주 수요일 03:07(한국)
  workflow_dispatch:
    inputs:
      days:
        description: '기간(일)'
        default: '14'

permissions:
  contents: write

concurrency:
  group: adsb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 항적 받기·계산
        run: bash adsb/run.sh ${{ inputs.days || '14' }}
      - name: 올리기(adsb 브랜치)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub && cp adsb/app.json adsb/rwy.json adsb/pfx_app.json adsb/pfa_app.json adsb/tod2.log pub/ 2>/dev/null || true
          cd pub
          git init -b adsb
          git config user.name "wx-bot"; git config user.email "wx-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "adsb $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git adsb
