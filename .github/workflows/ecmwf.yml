name: ecmwf-route-data
# ECMWF IFS 0.25°(+ GFS·AIFS 교차 확인) 최신 발표분 → 노선별 JSON → 'data' 가지(branch)에 올림 (앱이 여기서 받아 감)
on:
  schedule:
    - cron: '17 */3 * * *'      # 3시간마다 확인(새 발표분이 없으면 1분 안에 끝남)
  workflow_dispatch:
    inputs:
      force:
        description: '같은 발표분이어도 다시 만들기'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ecmwf-route-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: 준비
        run: pip install -r pipeline/requirements.txt
      - name: 직전 결과 확인
        run: |
          mkdir -p prevtree
          if git fetch origin data --depth=1 2>/dev/null; then git show FETCH_HEAD:manifest.json > prev.json; git archive FETCH_HEAD | tar -x -C prevtree; else echo '이전 결과 없음(첫 실행)'; fi
      - name: 원자료 받기·계산
        id: make
        run: python -I pipeline/make.py --out out_new --prev prev.json --prev-dir prevtree ${{ inputs.force && '--force' || '' }}
      - name: 결과 올리기
        if: steps.make.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out_new
          git init -q -b data
          git config user.name "wx-bot"
          git config user.email "wx-bot@users.noreply.github.com"
          git add -A
          git commit -qm "ECMWF $(python -c "import json;print(json.load(open('manifest.json'))['runIso'])")"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "올림: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/manifest.json"
